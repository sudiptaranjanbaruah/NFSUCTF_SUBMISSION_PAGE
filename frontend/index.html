<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NFSU CTF — Capture The Flag Competition Platform">
  <title>NFSU CTF Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚑</text></svg>">
  <link rel="stylesheet" href="/css/main.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <!-- Toast Notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Mobile Sidebar Toggle -->
  <button id="mobile-toggle" class="mobile-toggle hidden" onclick="toggleMobileSidebar()">☰</button>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside id="sidebar" class="sidebar hidden">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">⚑</div>
          <div>
            <div class="sidebar-logo-text">NFSU CTF</div>
            <div class="sidebar-logo-sub">Competition Platform</div>
          </div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Competition</div>
        <a class="nav-link" data-route="/dashboard" href="#/dashboard">
          <span class="icon">📊</span> Dashboard
        </a>
        <a class="nav-link" data-route="/challenges" href="#/challenges">
          <span class="icon">🏴</span> Challenges
        </a>
        <a class="nav-link" data-route="/leaderboard" href="#/leaderboard">
          <span class="icon">🏆</span> Leaderboard
        </a>
        <a class="nav-link" data-route="/profile" href="#/profile">
          <span class="icon">👤</span> Profile
        </a>
        <a class="nav-link" data-route="/info" href="#/info">
          <span class="icon">📋</span> Rules & Info
        </a>

        <div class="nav-section-title" id="admin-nav-section" style="display:none;">Administration</div>
        <a class="nav-link" data-route="/admin/dashboard" href="#/admin/dashboard" id="admin-nav-link" style="display:none;">
          <span class="icon">⚙️</span> Admin Panel
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-user-avatar">?</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-user-name">Team</div>
            <div class="sidebar-user-role" id="sidebar-user-role">team</div>
          </div>
        </div>
        <button class="btn btn-secondary btn-sm w-full mt-8" onclick="handleLogout()" style="font-size:12px;">↪ Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content">
      <div id="app">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/websocket.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/pages/login.js"></script>
  <script src="/js/pages/admin-login.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/challenges.js"></script>
  <script src="/js/pages/leaderboard.js"></script>
  <script src="/js/pages/profile.js"></script>
  <script src="/js/pages/info.js"></script>
  <script src="/js/pages/error.js"></script>
  <script src="/js/pages/admin.js"></script>

  <script>
    // Global handlers
    function handleLogout() {
      apiPost('/logout', {}).catch(() => {});
      clearToken();
      showToast('Logged out', 'info');
      navigateTo('/login');
    }

    function toggleMobileSidebar() {
      document.getElementById('sidebar').classList.toggle('mobile-open');
    }

    // Show admin nav for admin users
    function checkAdminNav() {
      const user = getUser();
      const adminSection = document.getElementById('admin-nav-section');
      const adminLink = document.getElementById('admin-nav-link');
      if (user && ['admin', 'super_admin'].includes(user.role)) {
        if (adminSection) adminSection.style.display = '';
        if (adminLink) adminLink.style.display = '';
      }
    }

    // Run on load
    if (getToken()) {
      initWebSocket();
      checkAdminNav();
    }

    // Recheck admin nav on hash change
    window.addEventListener('hashchange', checkAdminNav);
  </script>
</body>
</html>
